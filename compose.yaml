services:
  dsn:
    image: ${DSN_IMAGE:-dsn:local}
    build: .
    command: ["/config/settings.json"]
    ports:
      - "127.0.0.1:7070:7070"
      - "127.0.0.1:7071:7071"
    volumes:
      - dsn-data:/data
      - type: bind
        source: ./settings.docker.json
        target: /config/settings.json
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 30s
volumes:
  dsn-data:
