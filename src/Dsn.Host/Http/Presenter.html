<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSN · 데이터 탐색</title>
<style>
:root{font-family:system-ui,sans-serif;color:#dae5ee;background:#101820;color-scheme:dark}body{overflow-wrap:anywhere;max-width:1200px;margin:auto;padding:24px}h1{font-size:26px;margin-bottom:8px}p{color:#9fbbc9;line-height:1.6}section{background:#192630;border:1px solid #304551;border-radius:10px;padding:18px;margin:20px 0}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{min-width:0;display:grid;gap:6px;font-size:13px}input,select,button{font:inherit;padding:10px;border:1px solid #466272;border-radius:5px;background:#14212b;color:inherit;max-width:100%;box-sizing:border-box}input,select{width:100%;min-width:0}button{background:#245b6a;cursor:pointer}button:disabled{opacity:.4}#status{white-space:pre-wrap;min-height:24px}table{border-collapse:collapse;white-space:nowrap;font-size:13px;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #304551;max-width:360px;overflow:hidden;text-overflow:ellipsis}.scroll{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}canvas{width:100%;height:160px}summary{cursor:pointer;overflow-wrap:anywhere}small{color:#9fbbc9}.grow{flex:1;min-width:160px}header{border-bottom:1px solid #304551;padding-bottom:12px}@media(max-width:600px){body{padding:12px}section{padding:12px}.controls>*{flex:1 1 130px}}
</style>
<header><small>DSN / LOCAL DATA EXPLORER</small><h1>시험 PC 데이터 탐색</h1><p>Source별 기록을 확인하고, 보존한 원본을 Workspace로 다시 처리합니다.</p></header>
<section class="controls"><label class="grow">접속 토큰 · 로컬 무인증 모드는 비워 두세요<input id="token" type="password" autocomplete="off"></label><button id="connect">연결 / 목록 갱신</button><span id="health">미연결</span></section>
<section><p id="pipeline-path" aria-live="polite">Source → Workspace → SQLite</p><div class="controls"><label>Workspace<select id="workspace"></select></label><label class="grow">표시 field · 쉼표로 구분<input id="fields" placeholder="id,workspace,source_id,time"></label><label>Source 필터 · 현재 페이지<input id="source"></label><button id="read">처음 조회</button><button id="next">다음 100건</button><button id="download">현재 페이지 저장</button></div><p id="status" role="status">연결을 눌러 시작하세요.</p><div class="scroll"><table id="records"></table></div><p><small>시간 순서가 아닌 저장 ID 순서입니다. 차트와 Source 필터는 현재 조회 페이지에만 적용됩니다.</small></p><label>숫자 field · 현재 페이지 추세<select id="metric"><option value="">선택 안 함</option></select></label><canvas id="chart" aria-label="현재 페이지의 숫자 값 추세"></canvas></section>
<section><h2>보존 원본 · 재처리</h2><p>원래 대상 Workspace 모두에 대한 권한이 있어야 원본을 볼 수 있습니다. 재처리는 별도의 실행으로 결과를 추가하며, 접수 응답은 완료를 뜻하지 않습니다.</p><div class="controls"><button id="raw-first">처음 조회</button><button id="raw-next">다음 원본</button><label class="grow">재처리 대상 Workspace · 쉼표 구분<input id="targets"></label></div><div id="raw"></div></section>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let after=0,rawAfter=0,rows=[],known={},pipelines={};
async function api(path,options={}){const headers={...options.headers};if($('token').value)headers.Authorization='Bearer '+$('token').value;const r=await fetch(path,{...options,headers,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status+(r.status===401?' · 토큰을 확인하세요':r.status===403?' · 권한이 없습니다':r.status===409?' · 원본 보존이 꺼져 있습니다':''));return r.json();}
function action(fn){return async()=>{try{await fn();}catch(e){$('status').textContent=e.message;}};}
function cell(parent,tag,value){const e=document.createElement(tag);e.textContent=value==null?'':String(value);parent.append(e);return e;}
async function connect(){await api('/health');known=await api('/fields');pipelines=await api('/pipelines');const registered=await api('/workspaces');$('workspace').replaceChildren();for(const name of [...new Set([...registered,...Object.keys(known)])]){const o=document.createElement('option');o.textContent=name;$('workspace').append(o);}$('health').textContent='연결됨';choose();$('status').textContent='Workspace를 선택하고 조회하세요.';}
function choose(){const w=$('workspace').value;const p=pipelines[w]||{filters:[],sinks:['sqlite']};$('pipeline-path').textContent=['Source',w,...p.filters,p.sinks.join(' + ')].join(' → ');$('fields').value=[...new Set(['id','role','dut_id',...(known[w]||[]).filter(f=>f.startsWith('value_')),'time','source_id',...(known[w]||['workspace'])])].filter(f=>(known[w]||['id','workspace']).includes(f)).slice(0,31).join(',');$('targets').value=w;after=0;rows=[];render();}
function visible(){return rows.filter(r=>!$('source').value||String(r.source_id||'').includes($('source').value));}
function render(){const table=$('records');table.replaceChildren();const fields=$('fields').value.split(',').map(x=>x.trim()).filter(Boolean);const head=document.createElement('tr');for(const f of fields)cell(head,'th',f);table.append(head);for(const row of visible()){const tr=document.createElement('tr');for(const f of fields){const td=cell(tr,'td',row[f]);td.title=String(row[f]??'');}table.append(tr);}const prev=$('metric').value;$('metric').replaceChildren();const empty=document.createElement('option');empty.value='';empty.textContent='선택 안 함';$('metric').append(empty);for(const f of fields.filter(f=>f!=='id'&&rows.some(r=>typeof r[f]==='number'))){const o=document.createElement('option');o.textContent=f;$('metric').append(o);}$('metric').value=prev;plot();}
function plot(){const c=$('chart'),g=c.getContext('2d');c.width=Math.max(1,c.clientWidth)*devicePixelRatio;c.height=160*devicePixelRatio;g.scale(devicePixelRatio,devicePixelRatio);const w=c.clientWidth;g.clearRect(0,0,w,160);const data=visible().map(r=>r[$('metric').value]).filter(v=>typeof v==='number'&&Number.isFinite(v));if(!data.length)return;const lo=Math.min(...data),hi=Math.max(...data);g.fillStyle='#aac4cf';g.fillText('최소 '+lo+' / 최대 '+hi+' · '+data.length+'개',12,18);g.strokeStyle='#71d0c0';g.beginPath();data.forEach((v,i)=>{const x=12+i*(w-24)/Math.max(1,data.length-1),y=140-(v-lo)/(hi-lo||1)*100;i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();}
async function read(reset){if(reset)after=0;const q=new URLSearchParams({workspaces:$('workspace').value,fields:$('fields').value,afterId:after,limit:100});if(!$('fields').value.split(',').includes('id'))q.set('fields','id,'+$('fields').value);rows=await api('/view?'+q);if(rows.length)after=rows.at(-1).id;render();$('status').textContent=rows.length+'건 · 다음 조회 기준 ID '+after;}
async function raw(reset){if(reset)rawAfter=0;const data=await api('/raw?afterId='+rawAfter+'&limit=20');rawAfter=data.nextAfterId;$('raw').replaceChildren();for(const r of data.items){const d=document.createElement('details');cell(d,'summary','#'+r.id+' · '+r.envelope.sourceId+' · '+r.envelope.time);const {payload,...metadata}=r;cell(d,'pre',JSON.stringify(metadata,null,2));const bytes=Uint8Array.from(atob(payload),c=>c.charCodeAt(0));let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);try{text=JSON.stringify(JSON.parse(text),null,2);}catch{}text='Payload · UTF-8\n'+text;}catch{text='Payload · hex (앞 256 bytes)\n'+[...bytes.slice(0,256)].map(b=>b.toString(16).padStart(2,'0')).join(' ');}cell(d,'pre',text);const b=cell(d,'button','이 원본 재처리');b.onclick=action(async()=>{b.disabled=true;try{const result=await api('/raw/'+r.id+'/replay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workspaces:$('targets').value.split(',').map(x=>x.trim())})});$('status').textContent='재처리 접수 · replay_id '+result.replayId;}finally{b.disabled=false;}});$('raw').append(d);}if(!data.items.length)cell($('raw'),'p','이 페이지에 조회 가능한 원본이 없습니다. 다음 기준 ID '+rawAfter);}
$('connect').onclick=action(connect);$('workspace').onchange=choose;$('read').onclick=action(()=>read(true));$('next').onclick=action(()=>read(false));$('source').oninput=render;$('metric').onchange=plot;window.addEventListener('resize',plot);$('raw-first').onclick=action(()=>raw(true));$('raw-next').onclick=action(()=>raw(false));$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(visible(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='dsn-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};})();
</script></html>
